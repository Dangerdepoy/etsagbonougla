<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E75D3F"/>
      <stop offset="100%" stop-color="#D34B2E"/>
    </linearGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C94429" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#F2775C"/>
      <stop offset="70%" stop-color="#E85D3F"/>
      <stop offset="100%" stop-color="#B8381E" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="ribShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="0" stdDeviation="2" flood-color="#7A2210" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Panneau de fond arrondi -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)"/>

  <!-- Nervures verticales ondulées CORTEN (flutes) -->
  <g filter="url(#ribShadow)">
    <rect x="24"  y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="68"  y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="112" y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="156" y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="200" y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="244" y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="288" y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
    <rect x="332" y="20" width="32" height="200" rx="8" fill="url(#ribGrad)"/>
  </g>

  <!-- Ligne de texture industrielle fine -->
  <line x1="20" y1="20" x2="380" y2="20" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="20" y1="220" x2="380" y2="220" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
</svg>
